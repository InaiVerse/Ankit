version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend_service
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
