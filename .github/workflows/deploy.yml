name: Full Stack CI Pipeline (Separated Jobs)

on:
  push:
    branches: [ "main", "developer" ]
  pull_request:
    branches: [ "main", "developer" ]

# -----------------------------
# ✅ BACKEND JOB (Python)
# -----------------------------
jobs:
  backend-ci:
    name: Backend CI (Python + Docker)
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ Install Backend Dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Run Backend Tests
      - name: Run Backend Tests
        working-directory: backend
        run: |
          pytest || echo "No backend tests found"

      # ✅ Docker Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Build Backend Docker Image
      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest ./backend

      # ✅ Push Backend Docker Image
      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest


  # -----------------------------
  # ✅ FRONTEND JOB (Node + Docker)
  # -----------------------------
  frontend-ci:
    name: Frontend CI (Node + Docker)
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Setup Node
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ✅ Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      # ✅ Build Frontend
      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ✅ Docker Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ✅ Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest ./frontend

      # ✅ Push Frontend Docker Image
      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
